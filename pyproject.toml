[project]
name = "django-getlaw"
version = "0.1.0"
description = "Embed legal texts (Impressum, Datenschutz, AGB, Widerruf, Barrierefreiheit) from getLaw.de in Django projects."
readme = "README.md"
authors = [
    { name = "Ralf Zosel" },
]
requires-python = ">=3.10"
keywords = [
    "django",
    "getlaw",
    "impressum",
    "datenschutz",
    "legal",
    "dsgvo",
    "gdpr",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "django>=4.2",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/ralfzosel/django-getlaw"
Source = "https://github.com/ralfzosel/django-getlaw"
Issues = "https://github.com/ralfzosel/django-getlaw/issues"
"getLaw API" = "https://www.getlaw.de/api/"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/django_getlaw",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/django_getlaw",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = [
    "test_*.py",
]
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401",
]
"tests/**" = [
    "F841",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]
